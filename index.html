<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NS Games</title>
<meta name="description" content="Juegos para el navegador: estrategia online con amigos, arcade, idle y puzles. Sin instalar nada.">
<meta name="theme-color" content="#0d0b1a">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta property="og:title" content="NS Games">
<meta property="og:description" content="Juegos para el navegador. Sin instalar nada.">
<meta property="og:image" content="covers/hexopolis.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0b1a; --bg2: #151229; --card: #1a1631; --card2: #221d3d;
    --text: #f4f1ff; --muted: #a59fc4; --line: rgba(255,255,255,.08);
    --g1: #ffb547; --g2: #ff5e8a; --g3: #7b5cff; --g4: #29c7ac;
    --grad: linear-gradient(120deg, var(--g1), var(--g2) 50%, var(--g3));
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Nunito, system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }

  /* ---------- fondo vivo ---------- */
  .sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .28; animation: float 26s ease-in-out infinite alternate; }
  .blob.a { background: var(--g3); left: -20vmax; top: -25vmax; }
  .blob.b { background: var(--g2); right: -25vmax; top: 10vmax; animation-delay: -8s; opacity: .2; }
  .blob.c { background: var(--g1); left: 20vmax; bottom: -35vmax; animation-delay: -16s; opacity: .14; }
  @keyframes float { to { transform: translate(6vmax, 4vmax) scale(1.12); } }
  .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%); opacity: .5; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* ---------- cabecera ---------- */
  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand img { width: 46px; height: 46px; filter: drop-shadow(0 6px 18px rgba(255,94,138,.45)); transition: transform .4s cubic-bezier(.3,1.6,.5,1); }
  .brand:hover img { transform: rotate(-8deg) scale(1.08); }
  .wordmark { font-family: Fredoka, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: .5px; line-height: 1; }
  .wordmark b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .count { font-weight: 800; font-size: 13px; color: var(--muted); border: 1px solid var(--line); background: rgba(255,255,255,.04); padding: 8px 14px; border-radius: 999px; }
  .count span { color: var(--text); }

  /* ---------- portada destacada ---------- */
  .hero { position: relative; display: grid; grid-template-columns: 1.05fr 1fr; gap: 0; border-radius: 28px; overflow: hidden; background: var(--card); border: 1px solid var(--line); margin: 14px 0 56px; box-shadow: 0 30px 80px -30px color-mix(in srgb, var(--c) 55%, transparent); text-decoration: none; isolation: isolate; }
  .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 0% 100%, color-mix(in srgb, var(--c) 30%, transparent), transparent 60%); z-index: -1; }
  .hero-txt { padding: 48px 44px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .eyebrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--muted); }
  .pill.hot { background: var(--c); color: #1a1208; }
  .pill.live { color: var(--g4); background: color-mix(in srgb, var(--g4) 14%, transparent); }
  .pill.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--g4); margin-right: 6px; vertical-align: 1px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .hero h1 { font-family: Fredoka, sans-serif; font-weight: 700; font-size: clamp(40px, 6vw, 68px); line-height: .95; margin: 0; letter-spacing: -.5px; }
  .hero p { margin: 0; color: var(--muted); font-size: 18px; line-height: 1.5; max-width: 46ch; }
  .play { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; margin-top: 8px; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 20px; padding: 15px 28px; border-radius: 16px; background: var(--c); color: #1a1208; text-decoration: none; box-shadow: 0 10px 0 -2px color-mix(in srgb, var(--c) 55%, #000), 0 18px 40px -12px var(--c); transition: transform .15s, box-shadow .15s; }
  .play svg { width: 18px; height: 18px; }
  .hero:hover .play { transform: translateY(-2px); }
  .hero:active .play { transform: translateY(4px); box-shadow: 0 4px 0 -2px color-mix(in srgb, var(--c) 55%, #000); }
  .hero-img { position: relative; min-height: 380px; overflow: hidden; }
  .hero-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
  .hero:hover .hero-img img { transform: scale(1.05); }
  .hero-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--card) 0%, transparent 28%); }

  /* ---------- barra de filtros ---------- */
  .bar { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .bar h2 { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 32px; margin: 0; }
  .bar h2 small { font-family: Nunito, sans-serif; font-size: 15px; color: var(--muted); font-weight: 700; margin-left: 8px; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: 700 14px Nunito, sans-serif; color: var(--muted); background: rgba(255,255,255,.04); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: all .15s; }
  .chip:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .sort { font: 700 14px Nunito, sans-serif; color: var(--text); background: rgba(255,255,255,.04); border: 1px solid var(--line); padding: 8px 12px; border-radius: 12px; cursor: pointer; }
  .sort option { background: var(--bg2); }

  /* ---------- tarjetas ---------- */
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; padding-bottom: 40px; }
  .card { --rx: 0deg; --ry: 0deg; position: relative; display: flex; flex-direction: column; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; transform: perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .25s ease, box-shadow .25s ease, border-color .25s; animation: rise .6s backwards cubic-bezier(.2,.8,.2,1); animation-delay: calc(var(--i) * 70ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  .card:hover, .card:focus-visible { border-color: color-mix(in srgb, var(--c) 70%, transparent); box-shadow: 0 24px 60px -22px var(--c); outline: none; }
  .cover { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--bg2); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .7s cubic-bezier(.2,.8,.2,1), filter .4s; }
  .card:hover .cover img { transform: scale(1.07); filter: saturate(1.15); }
  .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(13,11,26,.55) 70%, var(--card) 100%); }
  .num { position: absolute; top: 14px; left: 14px; z-index: 2; font: 700 13px Fredoka, sans-serif; letter-spacing: 1px; background: rgba(13,11,26,.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 6px 10px; border-radius: 10px; }
  .badge { position: absolute; top: 14px; right: 14px; z-index: 2; font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; padding: 6px 10px; border-radius: 10px; background: var(--c); color: #1a1208; }
  .title { position: absolute; left: 20px; right: 20px; bottom: 10px; z-index: 2; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 30px; line-height: 1; text-shadow: 0 4px 20px rgba(0,0,0,.6); }
  .title::after { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--c); margin-top: 10px; }
  .body { padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .body p { margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.5; flex: 1; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 800; color: color-mix(in srgb, var(--c) 80%, #fff); background: color-mix(in srgb, var(--c) 13%, transparent); padding: 4px 9px; border-radius: 8px; }
  .go { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,255,255,.06); transition: background .2s, transform .2s, color .2s; }
  .go svg { width: 16px; height: 16px; }
  .card:hover .go { background: var(--c); color: #1a1208; transform: scale(1.08); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px; }

  footer { border-top: 1px solid var(--line); padding: 26px 0 40px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  footer a { color: var(--text); text-decoration: none; font-weight: 700; }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; }
    .hero-img { min-height: 0; aspect-ratio: 4 / 3; order: -1; }
    .hero-img::after { background: linear-gradient(0deg, var(--card) 0%, transparent 35%); }
    .hero-txt { padding: 6px 24px 30px; }
    .hero p { font-size: 16px; }
  }
  @media (max-width: 480px) {
    .wrap { padding: 0 16px; }
    .games { grid-template-columns: 1fr; }
    .wordmark { font-size: 22px; }
    .count { display: none; }
    .bar h2 { font-size: 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="grid-bg"></div><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>

<div class="wrap">
  <header>
    <a class="brand" href="./" aria-label="NS Games, inicio">
      <img src="logo.svg" alt="">
      <span class="wordmark">NS <b>Games</b></span>
    </a>
    <span class="count"><span id="n">0</span> juegos · gratis en el navegador</span>
  </header>

  <a class="hero" id="hero" href="#"></a>

  <section aria-labelledby="todos">
    <div class="bar">
      <h2 id="todos">Todos los juegos <small id="shown"></small></h2>
      <div class="controls">
        <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo"></div>
        <select class="sort" id="sort" aria-label="Ordenar">
          <option value="new">Más nuevos</option>
          <option value="az">De la A a la Z</option>
        </select>
      </div>
    </div>
    <div class="games" id="games"></div>
  </section>

  <footer>
    <span>NS Games · hechos con cariño, sin anuncios</span>
    <a href="https://github.com/5amuelN5/nsgames">Código en GitHub →</a>
  </footer>
</div>

<script>
(() => {
// Para añadir un juego: una entrada más aquí (carpeta, carátula en covers/, fecha para ordenar).
const GAMES = [
  { id: 'hexopolis', name: 'Hexópolis', date: '2026-11-13', color: '#ff9a4d', badge: 'Online',
    desc: 'Coloniza una isla que cambia en cada partida. Comercia, construye y gana a tus amigos en salas online o a bots de 4 niveles.',
    long: 'Una isla hexagonal distinta en cada partida. Consigue recursos, comercia, construye caminos y ciudades y llega a los puntos de victoria antes que nadie. De 2 a 6 jugadores, con mapa grande y reglas a tu gusto. Crea una sala y pasa el enlace a tus amigos, o juega contra bots de novato a experto.',
    tags: ['Estrategia', 'Multijugador'] },
  { id: 'minemergematic', name: 'MineMergeMatic', date: '2026-10-10', color: '#ffb547',
    desc: 'Mina, fusiona y automatiza tu cueva hasta encontrar el legendario Galactium.',
    tags: ['Idle', 'Fusión', 'Automatización'] },
  { id: 'bills-must-be-paid', name: 'Bills Must Be Paid', date: '2026-10-09', color: '#ff86b4',
    desc: 'Rompe cerditos hucha a martillazos para pagar todas tus facturas antes de que te ahoguen.',
    tags: ['Arcade', 'Clicker', 'Humor'] },
  { id: 'descenso-eterno', name: 'Descenso Eterno', date: '2026-10-06T23:46', color: '#f7b733',
    desc: 'Baja a un pozo sin fondo: pelea, mejora tu equipo en la Forja y llega cada vez más hondo.',
    tags: ['Idle', 'RPG'] },
  { id: '2048', name: '2048', date: '2026-10-06T23:11', color: '#8b7bff',
    desc: 'Une fichas iguales hasta llegar a 2048, y entrena a un bot que aprende a jugar solo.',
    tags: ['Puzle', 'IA'] },
];

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const arrow = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
const playIcon = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9.5-5.5z"/></svg>';
const byNew = (a, b) => b.date.localeCompare(a.date);
const newest = [...GAMES].sort(byNew);
const isNew = (g) => (Date.now() - new Date(g.date)) / 864e5 < 14;

$('#n').textContent = GAMES.length;

// portada: el juego más reciente
const feat = newest[0];
const hero = $('#hero');
hero.href = feat.id + '/';
hero.style.setProperty('--c', feat.color);
hero.innerHTML = `
  <div class="hero-txt">
    <div class="eyebrow">${isNew(feat) ? '<span class="pill hot">Nuevo</span>' : ''}${feat.tags.includes('Multijugador') ? '<span class="pill live">Juega con amigos</span>' : ''}${feat.tags.map((t) => `<span class="pill">${esc(t)}</span>`).join('')}</div>
    <h1>${esc(feat.name)}</h1>
    <p>${esc(feat.long || feat.desc)}</p>
    <span class="play">${playIcon} Jugar ahora</span>
  </div>
  <div class="hero-img"><img src="covers/${feat.id}.jpg" alt="Partida de ${esc(feat.name)}"></div>`;

// filtros
const TAGS = ['Todos', ...['Estrategia', 'Multijugador', 'Arcade', 'Idle', 'Puzle'].filter((t) => GAMES.some((g) => g.tags.includes(t)))];
let filter = 'Todos';
let order = 'new';
try { order = localStorage.getItem('ns_sort') || 'new'; } catch (e) { /* */ }
$('#sort').value = order;
$('#chips').innerHTML = TAGS.map((t) => `<button class="chip" type="button" data-t="${esc(t)}" aria-pressed="${t === filter}">${esc(t)}</button>`).join('');
$('#chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; filter = b.dataset.t; document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === b)); render(); });
$('#sort').addEventListener('change', (e) => { order = e.target.value; try { localStorage.setItem('ns_sort', order); } catch (er) { /* */ } render(); });

function render() {
  let list = GAMES.filter((g) => filter === 'Todos' || g.tags.includes(filter));
  list.sort(order === 'az' ? (a, b) => a.name.localeCompare(b.name, 'es') : byNew);
  $('#shown').textContent = list.length + (list.length === 1 ? ' juego' : ' juegos');
  $('#games').innerHTML = list.length ? list.map((g, i) => `
    <a class="card" href="${g.id}/" style="--c:${g.color};--i:${i}">
      <div class="cover">
        <img src="covers/${g.id}.jpg" alt="" loading="lazy">
        <span class="num">#${String(newest.indexOf(g) + 1).padStart(2, '0')}</span>
        ${g.badge ? `<span class="badge">${esc(g.badge)}</span>` : isNew(g) ? '<span class="badge">Nuevo</span>' : ''}
        <span class="title">${esc(g.name)}</span>
      </div>
      <div class="body">
        <p>${esc(g.desc)}</p>
        <div class="foot"><div class="tags">${g.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div><span class="go" aria-hidden="true">${arrow}</span></div>
      </div>
    </a>`).join('') : '<div class="empty">No hay juegos de este tipo todavía.</div>';
}
render();

// inclinación suave al pasar el ratón
if (matchMedia('(hover: hover) and (prefers-reduced-motion: no-preference)').matches) {
  document.addEventListener('pointermove', (e) => {
    const c = e.target.closest && e.target.closest('.card');
    document.querySelectorAll('.card').forEach((k) => { if (k !== c) { k.style.setProperty('--rx', '0deg'); k.style.setProperty('--ry', '0deg'); } });
    if (!c) return;
    const r = c.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    c.style.setProperty('--ry', (x * 7).toFixed(2) + 'deg');
    c.style.setProperty('--rx', (-y * 7).toFixed(2) + 'deg');
  });
}
})();
</script>
</body>
</html>
