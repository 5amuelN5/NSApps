<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NS Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f3ecdf; --card: #fffaf1; --text: #2d2a26; --muted: #7a7166; --accent: #c8642c; --line: #e2d6c3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1b18; --card: #2a2622; --text: #f1ebe2; --muted: #a99f92; --accent: #e3824a; --line: #3b352f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Nunito, system-ui, sans-serif; min-height: 100vh; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-family: Fredoka, sans-serif; font-size: 44px; margin: 0 0 6px; }
  p.sub { color: var(--muted); margin: 0 0 36px; }
  .games { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  a.game { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; color: inherit; text-decoration: none; transition: transform .15s, border-color .15s; }
  a.game:hover { transform: translateY(-3px); border-color: var(--accent); }
  .icon { font-size: 40px; color: var(--accent); line-height: 1; }
  .game h2 { font-family: Fredoka, sans-serif; margin: 12px 0 6px; font-size: 24px; }
  .game p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
  .tag { display: inline-block; margin-top: 14px; font-size: 13px; font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>NS Games</h1>
  <p class="sub">Juegos para el navegador. Sin instalar nada.</p>
  <div class="games">
    <a class="game" href="hexopolis/">
      <div class="icon">⬢</div>
      <h2>Hexópolis</h2>
      <p>Coloniza una isla hexagonal distinta en cada partida. Salas online con amigos y bots de 4 niveles.</p>
      <span class="tag">Jugar →</span>
    </a>
  </div>
</main>
</body>
</html>
