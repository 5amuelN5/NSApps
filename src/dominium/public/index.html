<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#131c29">
  <title>Dominium</title>
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231e3246'/%3E%3Ccircle cx='8' cy='8' r='4.5' fill='%23f2b33d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- iconos -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6M21 9l-5 6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 3V6a1 1 0 0 1 1-1Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
    <symbol id="i-army" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 7.7 8 9 4.6-1.3 8-4.5 8-9V6l-8-3Z"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6"/></symbol>
    <symbol id="i-plusarmy" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  </svg>

  <!-- ============================== MENÚ PRINCIPAL (misma estructura que Hexópolis) -->
  <section id="screen-menu" class="screen active">
    <div class="menu-bg" id="menu-bg" aria-hidden="true"></div>
    <div class="menu-glow" aria-hidden="true"></div>
    <a class="hub-back" id="hub-back" href="https://5amueln5.github.io/NSApps/" title="Volver a NS Apps">‹ NS Apps</a>
    <div class="menu-box">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="3"/><path d="M6 32h52M32 6v52" stroke="currentColor" stroke-width="2" opacity=".55"/><ellipse cx="32" cy="32" rx="12" ry="26" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"/><circle cx="32" cy="32" r="5" fill="currentColor"/></svg>
      </div>
      <h1 class="logo-title">Dominium<span class="dot">.</span></h1>
      <p class="logo-tag">Refuerza · Ataca · Conquista</p>
      <div class="prof-row">
        <button class="prof-chip" id="prof-chip" title="Tu perfil: nivel, estadísticas, logros y enlace de recuperación"></button>
        <button class="cup-btn" id="btn-ranking" title="Ranking de amigos" aria-label="Ranking de amigos">🏆</button>
      </div>
      <div id="invite" class="invite" hidden>Te han invitado a la sala <b id="invite-code"></b></div>
      <button class="btn big btn-green" id="btn-invite" hidden>▶ Unirse a la sala</button>
      <div class="resume-col"><button class="resume" id="btn-resume" hidden>↻ Volver a tu partida online</button></div>
      <div class="play-grid">
        <button class="play-card amber" id="btn-create-game"><span class="pc-ic">＋</span><b>Crear partida</b><small>Ponle nombre y añade bots o amigos</small></button>
        <button class="play-card teal" id="btn-join-game"><span class="pc-ic">🔑</span><b>Unirse a partida</b><small>Entra con el código de 5 letras</small></button>
      </div>
      <div id="srv-pill" class="srv-pill" hidden></div>
      <div class="menu-foot"><button class="link-btn" id="btn-rules">📖 Cómo se juega</button></div>
    </div>
  </section>

  <!-- ============================== SALA (LOBBY) -->
  <section id="screen-lobby" class="screen">
    <div class="lobby-wrap">
      <header class="lobby-head wood-bar">
        <button class="btn small" id="btn-lobby-leave"><svg class="ic"><use href="#i-back"/></svg>Salir</button>
        <div class="lobby-title">
          <input id="inp-room-name" class="room-name" maxlength="32" disabled aria-label="Nombre de la sala">
          <div class="code-box">Código <b id="room-code">-----</b>
            <button class="btn small" id="btn-copy"><svg class="ic"><use href="#i-link"/></svg>Copiar enlace</button>
          </div>
        </div>
        <label class="toggle"><input type="checkbox" id="chk-public"> <span>Sala pública</span></label>
      </header>

      <div class="lobby-grid">
        <div class="panel">
          <h2 class="panel-title">Jugadores <span id="slot-count" class="pill">0/8</span></h2>
          <ul id="slot-list" class="slot-list"></ul>
          <div class="add-bot host-only">
            <select id="sel-bot-level" aria-label="Nivel del bot"></select>
            <button class="btn" id="btn-add-bot">Añadir bot</button>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel-title">Mapa</h2>
          <div id="map-pick" class="map-pick"></div>
          <div id="map-preview" class="map-preview"></div>
          <div id="map-legend" class="map-legend"></div>
        </div>

        <div class="panel">
          <h2 class="panel-title">Reglas</h2>
          <div id="settings" class="settings"></div>
          <div class="lobby-actions">
            <button class="btn btn-gold big host-only" id="btn-start">Empezar partida</button>
            <button class="btn btn-red big guest-only" id="btn-ready">Estoy listo</button>
            <button class="btn btn-gold big" id="btn-join-lobby" hidden>Unirme a la partida</button>
          </div>
          <div class="chat-box">
            <div id="lobby-chat" class="chat-log"></div>
            <form id="lobby-chat-form" class="chat-form"><input maxlength="200" placeholder="Escribe un mensaje" aria-label="Mensaje"><button class="btn small">Enviar</button></form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================== PARTIDA -->
  <section id="screen-game" class="screen">
    <div class="game-wrap">
      <header class="topbar wood-bar">
        <button class="btn tiny" id="btn-menu" title="Menú" aria-label="Menú"><svg class="ic"><use href="#i-menu"/></svg></button>
        <div class="turn-info"><span id="turn-label">Turno 1</span><span id="map-label" class="muted-light"></span></div>
        <ol class="phases" id="phase-steps">
          <li data-ph="reinforce">Refuerzo</li><li data-ph="attack">Ataque</li><li data-ph="fortify">Fortificar</li>
        </ol>
        <div class="timer" id="timer"><div class="timer-fill" id="timer-fill"></div><span id="timer-text">--</span></div>
        <div class="clock" id="game-clock" title="Duración de la partida"><span class="ck-ic">⏱️</span><span id="clock-text">00:00</span></div>
        <div class="top-btns">
          <button class="btn tiny" id="btn-comfort" title="Ajustes" aria-label="Ajustes">⚙️</button>
          <button class="btn tiny" id="btn-regions" title="Ver regiones" aria-label="Ver regiones"><svg class="ic"><use href="#i-layers"/></svg></button>
          <button class="btn tiny" id="btn-sound" title="Sonido" aria-label="Sonido"><svg class="ic"><use href="#i-sound"/></svg></button>
          <button class="btn tiny" id="btn-side" title="Registro y chat" aria-label="Registro y chat"><svg class="ic"><use href="#i-chat"/></svg></button>
        </div>
        <div class="power" id="power" aria-label="Reparto del mapa"></div>
      </header>

      <aside class="side side-left" id="players-panel"></aside>

      <main class="map-area" id="map-area">
        <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="zoom-ctrl">
          <button class="btn tiny" data-zoom="in" aria-label="Acercar"><svg class="ic"><use href="#i-plus"/></svg></button>
          <button class="btn tiny" data-zoom="out" aria-label="Alejar"><svg class="ic"><use href="#i-minus"/></svg></button>
          <button class="btn tiny" data-zoom="fit" aria-label="Ver todo el mapa"><svg class="ic"><use href="#i-fit"/></svg></button>
        </div>
        <div class="vignette" aria-hidden="true"></div>
        <div id="turn-card" class="turn-card" aria-live="polite"></div>
        <div id="pact-offer" class="pact-offer" hidden></div>
        <div id="countdown" class="countdown" hidden></div>
        <div id="tooltip" class="tooltip"></div>
        <div id="banner" class="banner"></div>
        <div id="dice-tray" class="dice-tray"></div>
        <div id="floaters"></div>
      </main>

      <aside class="side side-right" id="side-right">
        <div class="tabs">
          <button class="tab active" data-tab="log">Registro</button>
          <button class="tab" data-tab="chat">Chat <span id="chat-badge" class="badge-dot"></span></button>
          <button class="tab" data-tab="regions">Regiones</button>
          <button class="tab" data-tab="luck">Suerte</button>
        </div>
        <div class="tab-body active" id="tab-log"><div id="game-log" class="log"></div></div>
        <div class="tab-body" id="tab-chat">
          <div id="game-chat" class="chat-log"></div>
          <form id="game-chat-form" class="chat-form"><input maxlength="200" placeholder="Mensaje" aria-label="Mensaje"><button class="btn small">Enviar</button></form>
        </div>
        <div class="tab-body" id="tab-regions"><div id="region-list"></div></div>
        <div class="tab-body" id="tab-luck"><div id="luck-list"></div></div>
      </aside>

      <footer class="actionbar" id="actionbar">
        <div class="ab-left">
          <button class="btn cards-btn" id="btn-cards"><svg class="ic"><use href="#i-card"/></svg>Cartas <span id="cards-count" class="pill">0</span></button>
          <button class="btn" id="btn-mission" hidden><svg class="ic"><use href="#i-target"/></svg>Misión</button>
          <div class="emote-wrap">
            <button class="btn" id="btn-emote" title="Reacciones" aria-label="Reacciones"><svg class="ic"><use href="#i-smile"/></svg></button>
            <div class="emote-pop" id="emote-pop" role="menu"></div>
          </div>
        </div>
        <div class="ab-center" id="ab-center"></div>
        <div class="ab-right" id="ab-right"></div>
      </footer>
    </div>
  </section>

  <!-- ============================== MODALES -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card panel" id="modal-card"></div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="bigmsg" class="bigmsg" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
